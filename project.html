<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detail proyek event dan pameran Andri Saputra.">
  <title>Detail Proyek | Andri Saputra</title>
  <link rel="stylesheet" href="css/project-detail.css">
</head>
<body>
  <main class="project-page">
    <a href="index.html#projects" class="back-link">← Kembali ke Proyek</a>

    <section class="project-hero" aria-labelledby="project-title">
      <div class="project-cover-wrap">
        <img id="project-cover" class="project-cover" src="" alt="" loading="eager">
      </div>

      <div class="project-heading">
        <p id="project-category" class="project-category"></p>
        <h1 id="project-title"></h1>
        <p id="project-description" class="project-description"></p>
      </div>
    </section>

    <section class="process-section" aria-labelledby="process-title">
      <div class="section-heading">
        <p class="eyebrow">PROJECT JOURNEY</p>
        <h2 id="process-title">Another Photos</h2>
        <p class="section-intro"></p>
      </div>

      <div class="process-carousel">
        <div id="process-gallery" class="process-gallery"></div>
        <div id="process-nav" class="process-nav" aria-label="Navigasi foto proses">
          <button id="process-prev" class="process-arrow" type="button" aria-label="Foto sebelumnya" disabled>‹</button>
          <button id="process-next" class="process-arrow" type="button" aria-label="Foto berikutnya">›</button>
        </div>
      </div>
      <p id="empty-process" class="empty-process" hidden>Dokumentasi proses untuk proyek ini belum tersedia.</p>
    </section>
  </main>

  <div id="lightbox" class="lightbox">
    <button class="lightbox-close">&times;</button>

    <button class="lightbox-prev" aria-label="Foto sebelumnya">
        &#10094;
    </button>

    <img id="lightbox-image" src="" alt="">

    <button class="lightbox-next" aria-label="Foto berikutnya">
        &#10095;
    </button>
  </div>

  <script src="js/project-detail.js"></script>
</body>
</html>
